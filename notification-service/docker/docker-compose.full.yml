# Full stack: application + Nginx + MongoDB + monitoring (Prometheus, Loki, Grafana).
#
# Run from notification-service root (reads .env from project root):
#   cp .env.example .env
#   docker compose -f docker/docker-compose.full.yml --env-file .env up -d --build
#
# Set COMPOSE_PROFILES=local|prod in .env.
# Profile local: bundled MongoDB/monitoring. Profile prod: app + Nginx only (cloud endpoints in .env).

name: notification-service-full

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: notification-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
      - "${NGINX_HTTPS_PORT:-8091}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      notification-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: notification-service:latest
    hostname: notification-service
    restart: unless-stopped
    expose:
      - "8093"
    ports:
      - "${NOTIFICATION_HOST_PORT:-8093}:8093"
    environment:
      # Inter-container defaults for bundled local stack; override via root .env for prod/cloud.
      - LOG_PATH=/app/logs
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/notification_db}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
    env_file:
      - path: ../.env
        required: true
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
      - drugstore-kafka-network
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
      loki:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  mongodb:
    profiles: [local]
    image: mongo:7
    container_name: notification-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_HOST_PORT:-27018}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE:-notification_db}
    volumes:
      - mongodb-data:/data/db
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    profiles: [local]
    image: prom/prometheus:v2.54.1
    container_name: notification-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9093}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      notification-service:
        condition: service_healthy
    networks:
      - drugstore-network

  loki:
    profiles: [local]
    image: grafana/loki:3.1.1
    container_name: notification-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3101}:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    profiles: [local]
    image: grafana/grafana:11.1.4
    container_name: notification-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

volumes:
  mongodb-data:
    name: notification-mongodb-data
  prometheus-data:
    name: notification-prometheus-data
  loki-data:
    name: notification-loki-data
  grafana-data:
    name: notification-grafana-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
  drugstore-kafka-network:
    external: true
    name: drugstore-kafka-network
