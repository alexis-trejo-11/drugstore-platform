# Application only: Nginx + notification-service (no bundled MongoDB or monitoring).
#
# Use when infrastructure runs elsewhere (host machine, another compose stack, or cloud).
#
# Profiles:
#   local — connect to services on the host via host.docker.internal
#   prod  — connect to managed cloud instances (Atlas, MSK, etc.)
#
# Examples:
#   docker compose -f docker-compose.app.yml --profile local --env-file .env --env-file .env.local up -d --build
#   docker compose -f docker-compose.app.yml --profile prod  --env-file .env --env-file .env.prod  up -d --build

name: notification-service-app

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: notification-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
      - "${NGINX_HTTPS_PORT:-8091}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      notification-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: notification-service:latest
    hostname: notification-service
    restart: unless-stopped
    expose:
      - "8093"
    ports:
      - "${NOTIFICATION_HOST_PORT:-8093}:8093"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NOTIFICATION_SERVICE_PORT=8093
      - SPRING_APPLICATION_NAME=notification-service
      - LOG_PATH=/app/logs
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-notification_db}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - GMAIL_USERNAME=${GMAIL_USERNAME:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - TWILIO_ENABLED=${TWILIO_ENABLED:-false}
      - LOG_LEVEL_APP=${LOG_LEVEL_APP:-INFO}
      - MONGODB_LOG_LEVEL=${MONGODB_LOG_LEVEL:-WARN}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    env_file:
      - path: .env
        required: false
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
