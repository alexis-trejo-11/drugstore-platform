# Application only: Nginx + notification-service (no bundled MongoDB or monitoring).
#
# Use when infrastructure runs elsewhere (host machine, another compose stack, or cloud).
#
# Run from notification-service root (reads .env from project root):
#   cp .env.example .env
#   docker compose -f docker/docker-compose.app.yml --env-file .env up -d --build
#
# Set COMPOSE_PROFILES=local|prod in .env (local = host.docker.internal, prod = cloud endpoints).

name: notification-service-app

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: notification-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
      - "${NGINX_HTTPS_PORT:-8091}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      notification-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  notification-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: notification-service:latest
    hostname: notification-service
    restart: unless-stopped
    expose:
      - "8093"
    ports:
      - "${NOTIFICATION_HOST_PORT:-8093}:8093"
    environment:
      LOG_PATH: /app/logs
    env_file:
      - path: ../.env
        required: true
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8093/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
