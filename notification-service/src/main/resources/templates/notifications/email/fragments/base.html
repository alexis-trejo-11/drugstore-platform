<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title}">Drugstore</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1f2937;
      line-height: 1.6;
    }
    .wrapper {
      max-width: 600px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(15, 118, 110, 0.08);
      border: 1px solid #e5ecea;
    }
    .header {
      background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
      color: #ffffff;
      padding: 28px 32px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .content {
      padding: 32px;
    }
    .content h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #134e4a;
    }
    .content p {
      margin: 0 0 16px;
      font-size: 15px;
      color: #374151;
    }
    .button {
      display: inline-block;
      margin: 8px 0 20px;
      padding: 14px 28px;
      background-color: #0f766e;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
    }
    .code-box {
      display: inline-block;
      margin: 16px 0;
      padding: 16px 28px;
      background-color: #f0fdfa;
      border: 1px dashed #5eead4;
      border-radius: 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #0f766e;
      text-align: center;
    }
    .muted {
      font-size: 13px;
      color: #6b7280;
    }
    .footer {
      background-color: #f9fafb;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }
    .footer p {
      margin: 0 0 6px;
      font-size: 12px;
      color: #9ca3af;
    }
    .brand {
      font-weight: 600;
      color: #0f766e;
    }
  </style>
</head>
<body>

<div th:fragment="header(subtitle)" class="header">
  <h1>Drugstore</h1>
  <p th:text="${subtitle}">Notifications</p>
</div>

<div th:fragment="footer" class="footer">
  <p><span class="brand">Drugstore</span> &copy; <span th:text="${currentYear}">2026</span></p>
  <p>This is an automated message. Please do not reply.</p>
</div>

</body>
</html>
