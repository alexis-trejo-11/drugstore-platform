plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

def loadDotEnv = {
    def env = [:]
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                env[key.trim()] = value.trim()
            }
        }
    }
    return env
}

def dotEnv = loadDotEnv()

def envOrDotEnv = { String key, String defaultValue = null ->
    def fromProperty = findProperty(key)
    (fromProperty != null ? fromProperty.toString() : null)
        ?: System.getenv(key)
        ?: dotEnv[key]
        ?: defaultValue
}

version = '1.0.0-SNAPSHOT'
group = 'io.github.alexisTrejo11.drugstore.microservices'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()

    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/alexisTrejo11/drugstore-platform")

        credentials {
            username = envOrDotEnv("GITHUB_ACTOR", "alexisTrejo11")
            password = envOrDotEnv("GITHUB_TOKEN")
        }
    }
}

ext {
    set('springCloudVersion', "2023.0.3")
}

dependencies {
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MongoDB dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Github packages dependency
    implementation 'io.github.alexisTrejo11:shared-kernel:2.0.0'

    // Config Server
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Mail dependencies
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Thymeleaf (classpath notification templates)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Twilio dependencies
    implementation 'com.twilio.sdk:twilio:8.31.1'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.2"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

bootRun {
    dotEnv.each { key, value ->
        // .env sets SPRING_PROFILES_ACTIVE=docker for Compose; bootRun should stay on the default standalone profile.
        if (key == 'SPRING_PROFILES_ACTIVE') {
            return
        }
        systemProperty key, value
        environment key, value
    }
}
