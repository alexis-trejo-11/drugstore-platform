server:
  port: ${CART_SERVICE_PORT}
  forward-headers-strategy: native

# gRPC Server Configuration
grpc:
  server:
    port: ${GRPC_SERVER_PORT:9091}
    enable-keep-alive: true
    keep-alive-time: 30s
    keep-alive-timeout: 5s
    max-inbound-message-size: 4MB
    permit-keep-alive-without-calls: true

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:cart-service}
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/drugstore_carts}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    encoding: UTF-8
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_FORMAT_SQL:true}
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: validate
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:cart-service-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: io.github.alexisTrejo11.drugstore.carts.product.core.application.events.ProductEvent
    listener:
      missing-topics-fatal: false   # so the app starts even if the topic doesn't exist yet

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-minutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}
  issuer: ${JWT_ISSUER:${ISSUER:drugstore-dev}}

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:drugstore:cart:}
  rate-limit:
    global:
      enabled: ${RATE_LIMIT_GLOBAL_ENABLED:true}
      maxRequests: ${RATE_LIMIT_GLOBAL_MAX:5000}
      durationHours: 1
    profiles:
      standard:
        maxRequests: ${RATE_LIMIT_STANDARD:40}
        durationSeconds: 60
      sensitive:
        maxRequests: ${RATE_LIMIT_SENSITIVE:7}
        durationSeconds: 60
      public:
        maxRequests: ${RATE_LIMIT_PUBLIC:100}
        durationSeconds: 60
      admin:
        maxRequests: ${RATE_LIMIT_ADMIN:50}
        durationSeconds: 1
      customer-write:
        maxRequests: ${RATE_LIMIT_CUSTOMER_WRITE:20}
        durationSeconds: 60
      customer-read:
        maxRequests: ${RATE_LIMIT_CUSTOMER_READ:100}
        durationSeconds: 60

loki:
  push-url: ${LOKI_PUSH_URL:http://localhost:3100/loki/api/v1/push}
  env: ${LOKI_ENV:local}

logging:
  file:
    name: ${LOG_PATH:logs}/cart-service.log
    path: ${LOG_PATH:logs}
    max-size: ${LOG_MAX_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.github.alexisTrejo11.drugstore: ${LOG_LEVEL_APP:DEBUG}
    libs_kernel.log.audit: ${LOG_LEVEL_AUDIT:INFO}

audit:
  log:
    enabled: ${AUDIT_LOG_ENABLED:true}
    excluded-endpoints: /actuator/health, /actuator/info, /swagger-ui.
    detailed: ${AUDIT_DETAILED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:always}
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: cart-service
      environment: development
