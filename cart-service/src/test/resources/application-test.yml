spring:
  datasource:
    url: jdbc:h2:mem:cart_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      missing-topics-fatal: false

server:
  port: 0

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-token-expiration-minutes: 60
  refresh-token-expiration-minutes: 120
  issuer: test-issuer

logging:
  level:
    root: WARN
