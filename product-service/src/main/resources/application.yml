server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: product-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

  profiles:
    active: dev
  boot:
    admin:
      client:
        url: http://localhost:8080
        instance:
          service-url: http://localhost:8080
          name: product-service

  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**
      poll-interval: 1000
      quiet-period: 400
    livereload:
      enabled: true

  cache:
    type: redis

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    schemas: public
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    env:
      enabled: true
    loggers:
      enabled: true
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    mail:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  packages-to-scan: io.github.alexisTrejo11.drugstore.products
  paths-to-match: /api/**
  cache:
    disabled: true

app:
  kafka:
    topics:
      product-events: product-events
      product-events-dlt: product-events.DLT

  rate-limit:
    global:
      enabled: true
      maxRequests: 5000
      durationHours: 1
    profiles:
      standard:
        maxRequests: 100
        durationSeconds: 60
      sensitive:
        maxRequests: 5
        durationSeconds: 300
      public:
        maxRequests: 1000
        durationSeconds: 60
      admin:
        maxRequests: 50
        durationSeconds: 1
      customer-read:
        maxRequests: 100
        durationSeconds: 60
      customer-write:
        maxRequests: 20
        durationSeconds: 60

logging:
  file:
    name: logs/products-service.log
    path: logs
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.github.alexisTrejo11.drugstore: DEBUG
    libs_kernel.log.audit: INFO
    io.github.alexisTrejo11.drugstore.products.infrastructure.adapter.output.kafka: DEBUG
    org.apache.kafka: INFO

audit:
  log:
    enabled: true
    excluded-endpoints: /actuator/health, /actuator/info, /swagger-ui.html, /v3/api-docs

jwt:
  secret: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER:product-service}
