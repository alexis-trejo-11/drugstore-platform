# Full stack: application + Nginx + PostgreSQL + Redis + monitoring (Prometheus, Loki, Grafana).
#
# Profiles:
#   local — starts bundled infrastructure containers (default for development)
#   prod  — application + Nginx only; DB/Redis/Kafka/monitoring come from cloud env vars
#
# Examples:
#   docker compose -f docker-compose.full.yml --profile local --env-file .env --env-file .env.local up -d --build
#   docker compose -f docker-compose.full.yml --profile prod  --env-file .env --env-file .env.prod  up -d --build

name: product-service-full

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: product-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      product-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  product-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: product-service:latest
    hostname: product-service
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${PRODUCT_SERVICE_HOST_PORT:-8086}:8080"
    environment:
      - SPRING_APPLICATION_NAME=product-service
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CLOUD_BOOTSTRAP_ENABLED=false
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB_NAME=${DB_NAME:-product_db}
      - POSTGRES_DB_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${DB_NAME:-product_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_DATA_REDIS_HOST=${REDIS_HOST:-redis}
      - SPRING_DATA_REDIS_PORT=${REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - JWT_ISSUER=${JWT_ISSUER:-product-service}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - LOG_PATH=/app/logs
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    env_file:
      - path: .env
        required: false
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
      - drugstore-kafka-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      loki:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  postgres:
    profiles: [local]
    image: postgres:15-alpine
    container_name: product-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-product_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-product_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    profiles: [local]
    image: redis:7-alpine
    container_name: product-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6378}:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    profiles: [local]
    image: prom/prometheus:v2.54.1
    container_name: product-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      product-service:
        condition: service_healthy
    networks:
      - drugstore-network

  loki:
    profiles: [local]
    image: grafana/loki:3.1.1
    container_name: product-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    profiles: [local]
    image: grafana/grafana:11.1.4
    container_name: product-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

volumes:
  postgres-data:
    name: product-postgres-data
  redis-data:
    name: product-redis-data
  prometheus-data:
    name: product-prometheus-data
  loki-data:
    name: product-loki-data
  grafana-data:
    name: product-grafana-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
  drugstore-kafka-network:
    external: true
    name: drugstore-kafka-network
