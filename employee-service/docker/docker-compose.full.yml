# Full stack: application + Nginx + PostgreSQL + Redis + monitoring (Prometheus, Loki, Grafana).
#
# Run from employee-service root (reads .env from project root):
#   cp .env.example .env
#   docker compose -f docker/docker-compose.full.yml --env-file .env up -d --build
#
# Set COMPOSE_PROFILES=local|prod in .env.
# Profile local: bundled DB/Redis/monitoring. Profile prod: app + Nginx only (cloud endpoints in .env).

name: employee-service-full

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: employee-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      employee-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  employee-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-alexisTrejo11}
        GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env for GitHub Packages}
    hostname: employee-service
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # Inter-container defaults for bundled local stack; override via root .env for prod/cloud.
      - DATASOURCE_URL=${DATASOURCE_URL:-jdbc:postgresql://postgres:5432/employee_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    env_file:
      - path: ../.env
        required: true
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      loki:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  postgres:
    profiles: [local]
    image: postgres:15-alpine
    container_name: employee-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-employee_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5431}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-employee_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [local]
    image: redis:7-alpine
    container_name: employee-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6378}:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    profiles: [local]
    image: prom/prometheus:v2.54.1
    container_name: employee-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      employee-service:
        condition: service_healthy
    networks:
      - drugstore-network

  loki:
    profiles: [local]
    image: grafana/loki:3.1.1
    container_name: employee-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    profiles: [local]
    image: grafana/grafana:11.1.4
    container_name: employee-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

volumes:
  postgres-data:
    name: employee-postgres-data
  redis-data:
    name: employee-redis-data
  prometheus-data:
    name: employee-prometheus-data
  loki-data:
    name: employee-loki-data
  grafana-data:
    name: employee-grafana-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
