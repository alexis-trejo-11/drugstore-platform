# Copy `.env.example` → `.env` and set values. Compose reads `.env` for `${VAR}` substitution
# and passes variables into containers via `env_file`.
services:
  employee-service:
    build:
      context: .
      dockerfile: ./dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:?Set GITHUB_ACTOR in .env for GitHub Packages}
        GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env for GitHub Packages}
    image: employee-service:latest
    # container_name removed to allow scaling:
    #   docker compose up --scale employee-service=3
    hostname: employee-service
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "8084:8080"
    env_file:
      - .env
    environment:
      - SPRING_APPLICATION_NAME=employee-service
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CLOUD_BOOTSTRAP_ENABLED=false
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - STORE_DB=${DB_NAME:?DB_NAME must be set in .env}
      - POSTGRES_DB_NAME=${DB_NAME:?DB_NAME must be set in .env}
      - POSTGRES_USER=${DB_USER:?DB_USER must be set in .env}
      - POSTGRES_DB_USER=${DB_USER:?DB_USER must be set in .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # Override .env localhost values — Spring binds SPRING_DATA_REDIS_* directly (higher precedence than YAML)
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      - ISSUER=${ISSUER:?ISSUER must be set in .env}
      - JWT_ISSUER=${JWT_ISSUER:?JWT_ISSUER must be set in .env}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:?SWAGGER_ENABLED must be set in .env}
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: employee-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - drugstore-network

  loki:
    image: grafana/loki:3.1.1
    container_name: employee-loki
    restart: unless-stopped
    # Single-process mode avoids "zone not set" ring errors in local dev
    command: -config.file=/etc/loki/local-config.yaml -target=all
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: employee-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

  nginx:
    image: nginx:1.27-alpine
    container_name: employee-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount ssl directory (not individual files) — run nginx/ssl/generate-certs.sh first
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      employee-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: employee-postgres
    restart: unless-stopped
    ports:
      - "5431:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER must be set in .env}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: employee-redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
    name: employee-prometheus-data
  loki-data:
    name: employee-loki-data
  grafana-data:
    name: employee-grafana-data
  postgres-data:
    name: employee-postgres-data
  redis-data:
    name: employee-redis-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
