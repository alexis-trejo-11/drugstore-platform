server:
  port: ${EMPLOYEE_SERVICE_PORT}
  forward-headers-strategy: native

spring:
  application:
    name: employee-service

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev
  boot:
    admin:
      client:
        enabled: ${SPRING_BOOT_ADMIN_CLIENT_ENABLED:false}
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:8080}
        instance:
          service-url: ${SPRING_BOOT_ADMIN_SERVICE_URL:http://localhost:8080}
          name: employee-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**
      poll-interval: 1000
      quiet-period: 400
    livereload:
      enabled: true

  cache:
    type: redis

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/employee_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    env:
      enabled: true
    loggers:
      enabled: true
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  packages-to-scan:  io.github.alexisTrejo11.drugstore.employees
  paths-to-match: /api/**
  cache:
    disabled: true

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:drugstore:employee:}
  rate-limit:
    global:
      enabled: true
      maxRequests: 5000
      durationHours: 1
    profiles:
      standard:
        maxRequests: 40
        durationSeconds: 60
      sensitive:
        maxRequests: 7
        durationSeconds: 60
      public:
        maxRequests: 100
        durationSeconds: 60
      admin:
        maxRequests: 50
        durationSeconds: 1
      customer-write:
        maxRequests: 20
        durationSeconds: 60
      customer-read:
        maxRequests: 100
        durationSeconds: 60

loki:
  push-url: ${LOKI_PUSH_URL:http://localhost:3100/loki/api/v1/push}
  env: ${LOKI_ENV:local}

logging:
  file:
    name: logs/employee-service.log
    path: logs
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.github.alexisTrejo11.drugstore: DEBUG
    libs_kernel.log.audit: INFO

audit:
  log:
    enabled: true
    excluded-endpoints: /actuator/health, /actuator/info, /swagger-ui.html, /v3/api-docs


jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-minutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200} # 30 days
  issuer: ${JWT_ISSUER:drugstore-api}

