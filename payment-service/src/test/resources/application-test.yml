spring:
  datasource:
    url: jdbc:h2:mem:payment_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379

server:
  port: 0

stripe:
  api-key: sk_test_placeholder
  webhook-secret: whsec_placeholder

logging:
  level:
    root: WARN
