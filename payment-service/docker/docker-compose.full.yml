# Full stack: application + Nginx + PostgreSQL + monitoring (Prometheus, Loki, Grafana).
#
# Profiles:
#   local — starts bundled infrastructure containers (default for development)
#   prod  — application + Nginx only; DB/monitoring come from cloud env vars
#
# Examples:
#   docker compose -f docker-compose.full.yml --profile local --env-file .env --env-file .env.local up -d --build
#   docker compose -f docker-compose.full.yml --profile prod  --env-file .env --env-file .env.prod  up -d --build

name: payment-service-full

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: payment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: payment-service:latest
    hostname: payment-service
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-8085}:8080"
    environment:
      - SPRING_APPLICATION_NAME=payment-service
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - LOG_PATH=/app/logs
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${DB_NAME:-drugstore_payments}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${DB_NAME:-drugstore_payments}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - STRIPE_API_KEY=${STRIPE_API_KEY:?Set STRIPE_API_KEY in .env}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    env_file:
      - path: .env
        required: false
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      loki:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  postgres:
    profiles: [local]
    image: postgres:15-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-drugstore_payments}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-drugstore_payments}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  prometheus:
    profiles: [local]
    image: prom/prometheus:v2.54.1
    container_name: payment-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - drugstore-network

  loki:
    profiles: [local]
    image: grafana/loki:3.1.1
    container_name: payment-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    profiles: [local]
    image: grafana/grafana:11.1.4
    container_name: payment-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

volumes:
  postgres-data:
    name: payment-postgres-data
  prometheus-data:
    name: payment-prometheus-data
  loki-data:
    name: payment-loki-data
  grafana-data:
    name: payment-grafana-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
