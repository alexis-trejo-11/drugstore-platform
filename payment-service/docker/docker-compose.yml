# Payment Service — Docker Compose
#
# Run from the service root (always pass --env-file .env):
#   cp .env.example .env
#   docker compose -f docker/docker-compose.yml --env-file .env <PROFILES> up -d --build
#
# Profiles (combine as needed):
#   (none)           App container only — use .env for cloud/host DB, Redis, Kafka, etc.
#   --profile nginx  TLS reverse proxy on :80 / :443 (run ./docker/nginx/ssl/generate-certs.sh first)
#   --profile infra  Bundled data stores (Postgres/Redis/MongoDB — see services below)
#   --profile observability  Prometheus + Loki + Grafana
#
# Examples:
#   App only (RDS / Upstash / host DB in .env):
#     docker compose -f docker/docker-compose.yml --env-file .env up -d --build
#
#   App + bundled local Postgres & Redis:
#     docker compose -f docker/docker-compose.yml --env-file .env --profile infra up -d --build
#
#   Full local dev stack (app + infra + monitoring):
#     docker compose -f docker/docker-compose.yml --env-file .env --profile infra --profile observability up -d --build
#
#   App + Nginx + cloud infrastructure (.env endpoints):
#     docker compose -f docker/docker-compose.yml --env-file .env --profile nginx up -d --build
#
#   Everything (Nginx + infra + observability):
#     docker compose -f docker/docker-compose.yml --env-file .env --profile nginx --profile infra --profile observability up -d --build

name: payment-service

services:
  nginx:
    profiles: [nginx]
    image: nginx:1.27-alpine
    container_name: payment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - drugstore_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-alexisTrejo11}
        GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env for GitHub Packages}
    hostname: payment-service
    restart: unless-stopped
    expose:
      - ${PAYMENT_SERVICE_PORT}
    ports:
      - ${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}
    environment:
      # Inter-container defaults for bundled local stack; override via root .env for prod/cloud.
      - LOG_PATH=/app/logs
      - DATASOURCE_URL=${DATASOURCE_URL:-jdbc:postgresql://postgres:5432/drugstore_payments}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    env_file:
      - path: ../.env
        required: true
    volumes:
      - ../logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - drugstore_network
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      loki:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PAYMENT_SERVICE_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  postgres:
    profiles: [infra]
    image: postgres:15-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-drugstore_payments}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-drugstore_payments}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [infra]
    image: redis:7-alpine
    container_name: payment-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6385}:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.1
    container_name: payment-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - drugstore_network

  loki:
    profiles: [observability]
    image: grafana/loki:3.1.1
    container_name: payment-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - drugstore_network

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.1.4
    container_name: payment-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore_network

volumes:
  postgres-data:
    name: payment-postgres-data
  redis-data:
    name: payment-redis-data
  prometheus-data:
    name: payment-prometheus-data
  loki-data:
    name: payment-loki-data
  grafana-data:
    name: payment-grafana-data

networks:
  drugstore_network:
    external: true
