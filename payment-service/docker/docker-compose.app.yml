# Application only: Nginx + payment-service (no bundled DB or monitoring).
#
# Use when infrastructure runs elsewhere (host machine, another compose stack, or cloud).
#
# Profiles:
#   local — connect to services on the host via host.docker.internal
#   prod  — connect to managed cloud instances (RDS, Grafana Cloud, etc.)
#
# Examples:
#   docker compose -f docker-compose.app.yml --profile local --env-file .env --env-file .env.local up -d --build
#   docker compose -f docker-compose.app.yml --profile prod  --env-file .env --env-file .env.prod  up -d --build

name: payment-service-app

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: payment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  payment-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: payment-service:latest
    hostname: payment-service
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-8085}:8080"
    environment:
      - SPRING_APPLICATION_NAME=payment-service
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - LOG_PATH=/app/logs
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - DB_NAME=${DB_NAME:-drugstore_payments}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${DB_NAME:-drugstore_payments}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - STRIPE_API_KEY=${STRIPE_API_KEY:?Set STRIPE_API_KEY in .env}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET in .env}
      - LOKI_PUSH_URL=${LOKI_PUSH_URL}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
    env_file:
      - path: .env
        required: false
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
