services:
  order-service:
    build:
      context: .
      dockerfile: ./dockerfile
    image: order-service:latest
    # container_name removed to allow scaling:
    #   docker compose up --scale order-service=3
    hostname: order-service
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      # Host port: use ${VAR:-default} syntax (VAR:8080 is invalid in Compose).
      - "${ORDER_SERVICE_HOST_PORT:-8086}:8080"
    environment:
      - SPRING_APPLICATION_NAME=order-service
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CLOUD_BOOTSTRAP_ENABLED=false
      # Matches application-docker.yml placeholders (${POSTGRES_DB_NAME}, ${POSTGRES_DB_USER})
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB_NAME=${DB_NAME:-order_db}
      - POSTGRES_DB_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      # Explicit JDBC overrides so URL host always resolves inside Compose DNS
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-order_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      # application-docker.yml uses REDIS_HOST / REDIS_PORT
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Required: no default secret in compose (set in .env from .env.example)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set - copy .env.example to .env}
      - JWT_ISSUER=${JWT_ISSUER:-order-service}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-true}
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: order-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - drugstore-network

  loki:
    image: grafana/loki:3.1.1
    container_name: order-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: order-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

  nginx:
    image: nginx:1.27-alpine
    container_name: order-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Writable dir: entrypoint generates PEMs if missing (see nginx/docker-entrypoint.d).
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/docker-entrypoint.d/99-order-generate-tls.sh:/docker-entrypoint.d/99-order-generate-tls.sh:ro
    depends_on:
      order-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: order-postgres
    restart: unless-stopped
    ports:
      - "5431:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-order_db}
    healthcheck:
      # $$ expands to $ inside the container shell so postgres env vars apply there
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: order-redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
    name: order-prometheus-data
  loki-data:
    name: order-loki-data
  grafana-data:
    name: order-grafana-data
  postgres-data:
    name: order-postgres-data
  redis-data:
    name: order-redis-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
