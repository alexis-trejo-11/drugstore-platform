spring:
  application:
    name: order-service-test
  datasource:
    url: jdbc:h2:mem:order_service_integration;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  data:
    redis:
      url: redis://localhost:6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: simple
  boot:
    admin:
      client:
        enabled: false

app:
  rate-limit:
    global:
      enabled: false

jwt:
  secret: test-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-safety-12345
  access-token-expiration-minutes: 60
  refresh-token-expiration-minutes: 120
  issuer: order-service-test

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true

logging:
  level:
    root: WARN
    io.github.alexisTrejo11.drugstore.order: INFO
