server:
  port: ${STORE_SERVICE_PORT}
  forward-headers-strategy: native

spring:
  application:
    name: store-service

  profiles:
    active: dev

  boot:
    admin:
      client:
        url: http://localhost:8080
        instance:
          service-url: http://localhost:8080
          name: store-service

  devtools:
    restart:
      enabled: true
      exclude: static/**,public/**
      poll-interval: 1000
      quiet-period: 400
    livereload:
      enabled: true

  cache:
    type: redis

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
  endpoint:
    health:
      show-details: always
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    env:
      enabled: true
    loggers:
      enabled: true
  info:
    env:
      enabled: true
  health:
    db:
      enabled: true
    diskspace:
      enabled: true
    mail:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    disable-swagger-default-url: true
    url: /v3/api-docs
    config-url: /v3/api-docs/swagger-config
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  packages-to-scan: io.github.alexisTrejo11.drugstore.stores
  paths-to-match: /api/**
  cache:
    disabled: true

app:
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:drugstore:store:}
  rate-limit:
    global:
      enabled: true
      maxRequests: 5000
      durationHours: 1
    profiles:
      standard:
        maxRequests: 100
        durationSeconds: 60
      sensitive:
        maxRequests: 5
        durationSeconds: 300
      public:
        maxRequests: 1000
        durationSeconds: 60
      admin:
        maxRequests: 50
        durationSeconds: 1
      customer-read:
        maxRequests: 100
        durationSeconds: 60
      customer-write:
        maxRequests: 20
        durationSeconds: 60

loki:
  push-url: ${LOKI_PUSH_URL:http://localhost:3100/loki/api/v1/push}
  env: ${LOKI_ENV:local}

logging:
  file:
    name: logs/store-service.log
    path: logs
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    io.github.alexisTrejo11.drugstore: DEBUG
    libs_kernel.log.audit: INFO

audit:
  log:
    enabled: true
    excluded-endpoints: /actuator/health, /actuator/info, /swagger-ui.html, /v3/api-docs

jwt:
  secret: ${JWT_SECRET_KEY}
  issuer: ${JWT_ISSUER:store-service}
