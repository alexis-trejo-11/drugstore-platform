plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

def loadDotEnv = {
    def env = [:]
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                env[key.trim()] = value.trim()
            }
        }
    }
    return env
}

def dotEnv = loadDotEnv()

def envOrDotEnv = { String key, String defaultValue = null ->
    def fromProperty = findProperty(key)
    (fromProperty != null ? fromProperty.toString() : null)
            ?: System.getenv(key)
            ?: dotEnv[key]
            ?: defaultValue
}

version = '1.0.0-SNAPSHOT'
group = 'io.github.alexisTrejo11.drugstore.microservices'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()

    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/alexisTrejo11/drugstore-platform")

        credentials {
            username = envOrDotEnv("GITHUB_ACTOR", "alexisTrejo11")
            password = envOrDotEnv("GITHUB_TOKEN")
        }
    }
}

ext {
    set('springBootAdminVersion', "3.3.2")
    set('springCloudVersion', "2023.0.3")
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Jackson Java 8 Date/Time module
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Github packages dependency
    implementation 'io.github.alexisTrejo11:shared-kernel:2.0.0'

    // Spring Boot Admin
    implementation 'de.codecentric:spring-boot-admin-starter-client:3.1.5'

    // Open API
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Migrations
    implementation 'org.flywaydb:flyway-core:10.17.0'
    implementation 'org.flywaydb:flyway-database-postgresql:10.17.0'

    // Database
    implementation 'org.postgresql:postgresql:42.7.3'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'com.h2database:h2'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Redis Cache
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Observability
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "de.codecentric:spring-boot-admin-dependencies:${springBootAdminVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    def classpathForAgent = classpath
    jvmArgumentProviders.add(new org.gradle.process.CommandLineArgumentProvider() {
        @Override
        Iterable<String> asArguments() {
            def mockitoJar = classpathForAgent.find { it.name.startsWith('mockito-core-') && it.name.endsWith('.jar') }
            return mockitoJar ? ["-javaagent:${mockitoJar.absolutePath}".toString(), '-XX:+EnableDynamicAgentLoading'] : ['-XX:+EnableDynamicAgentLoading']
        }
    })
}

bootRun {
    jvmArgs = [
            "-XX:+TieredCompilation",
            "-XX:TieredStopAtLevel=1",
            "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ]

    def loadedLogPath = System.getenv('LOG_PATH')
    def envFile = file('./.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                key = key.trim()
                value = value.trim()
                if (key == 'LOG_PATH') {
                    loadedLogPath = value
                }
                systemProperty key, value
                environment key, value
            }
        }
    }
    if (!loadedLogPath) {
        def localLogs = file('logs').absolutePath
        systemProperty 'LOG_PATH', localLogs
        environment 'LOG_PATH', localLogs
    }
}

tasks.register('buildDockerImage', Exec) {
    dependsOn bootJar
    commandLine 'docker', 'build', '-f', 'docker/Dockerfile', '-t', 'store-service:latest', '.'
}

