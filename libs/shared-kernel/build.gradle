plugins {
    id 'java-library'
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'maven-publish'
}

group = 'io.github.alexisTrejo11'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://projectlombok.org/edge-releases'
    }
}

ext {
    set('springCloudVersion', "2023.0.3")
}

dependencies {
    // Lombok
    compileOnly 'org.projectlombok:lombok:edge-SNAPSHOT'
    annotationProcessor 'org.projectlombok:lombok:edge-SNAPSHOT'

    // Jackson Java 8 Date/Time module
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


tasks.named('bootJar').configure {
    enabled = false
}

tasks.named('jar').configure {
    enabled = true
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'io.github.alexisTrejo11'
            artifactId = 'shared-kernel'
            version = '2.0.0'

            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/alexisTrejo11/drugstore-platform")

            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: "alexisTrejo11"
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
