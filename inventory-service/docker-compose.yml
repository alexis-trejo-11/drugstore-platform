# Copy `.env.example` → `.env` and set values. Compose reads `.env` for `${VAR}` substitution
# and `env_file` injects the same file into containers (no secrets or mutable defaults in this file).
services:
  inventory-service:
    build:
      context: .
      dockerfile: ./dockerfile
    image: inventory-service:latest
    # container_name removed to allow scaling:
    #   docker compose up --scale inventory-service=3
    hostname: inventory-service
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${SERVER_PORT}"
    ports:
      - "${INVENTORY_HOST_PORT}:${SERVER_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CLOUD_BOOTSTRAP_ENABLED=false
      # application-docker.yml expects POSTGRES_* for JDBC; DB_* are the canonical names in .env
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${SERVER_PORT}/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: inventory-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - drugstore-network

  loki:
    image: grafana/loki:3.1.1
    container_name: inventory-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: inventory-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

  nginx:
    image: nginx:1.27-alpine
    container_name: inventory-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./nginx/ssl/nginx.key:/etc/nginx/ssl/nginx.key:ro
    depends_on:
      inventory-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    ports:
      - "5431:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
    name: inventory-prometheus-data
  loki-data:
    name: inventory-loki-data
  grafana-data:
    name: inventory-grafana-data
  postgres-data:
    name: inventory-postgres-data
  redis-data:
    name: inventory-redis-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
