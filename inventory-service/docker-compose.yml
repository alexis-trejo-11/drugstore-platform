# inventory-service — app-only. Shared infra (Postgres/Redis/Kafka/observability) lives outside this repo.
# Usage (from this directory):
#   cp .env.example .env
#   docker compose up -d --build
name: inventory-service

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: inventory-service
    container_name: inventory-service-api
    restart: unless-stopped
    ports:
      - ${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - infra_central_network
      - shared_app_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${INVENTORY_SERVICE_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

networks:
  infra_central_network:
    external: true
  shared_app_network:
    external: true
