worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/xml text/css
               application/javascript text/javascript;

    # ── Upstream (load-balanced inventory-service replicas) ────────────────────
    # Docker's embedded DNS round-robins across all containers named
    # "inventory-service" when you scale with:
    #   docker compose up --scale inventory-service=N
    # The resolver directive points at Docker's internal DNS (127.0.0.11).
    resolver 127.0.0.11 valid=5s;

    upstream inventory_backend {
        # least_conn sends new requests to the instance with fewest active connections.
        least_conn;

        # Docker DNS will expand "inventory-service" to all running replicas.
        server inventory-service:8084;

        # Connection health settings.
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS reverse proxy ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Nginx's own TLS termination cert (self-signed for dev).
        # Replace with a real cert in production.
        ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options           DENY                                  always;
        add_header X-Content-Type-Options    nosniff                               always;

        # Request size limit (store API payloads)
        client_max_body_size 1m;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        location / {
            proxy_pass http://inventory_backend;

            # Preserve original connection context.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Enable HTTP/1.1 keep-alive to the upstream.
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Pass actuator health checks through without redirects.
        location /actuator/health {
            proxy_pass http://inventory_backend/actuator/health;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
