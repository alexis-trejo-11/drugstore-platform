# Activated via spring.profiles.active=test (see src/test/resources/application.yml).
# Integration tests use H2 in-memory (PostgreSQL compatibility mode), real JWT validation, no Redis/Kafka.

spring:
  datasource:
    url: jdbc:h2:mem:inventory_integration;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

  cache:
    type: simple

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  boot:
    admin:
      client:
        enabled: false

app:
  rate-limit:
    global:
      enabled: false

jwt:
  secret: integration-test-jwt-secret-key-min-32-bytes!!
  access-token-expiration-minutes: 60
  refresh-token-expiration-minutes: 120
  issuer: inventory-integration-test

management:
  health:
    redis:
      enabled: false
    db:
      enabled: true

server:
  port: 0

logging:
  level:
    root: WARN
    io.github.alexisTrejo11.drugstore.inventories: INFO
