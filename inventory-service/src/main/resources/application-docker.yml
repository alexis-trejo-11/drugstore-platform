server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048

spring:
  application:
    name: inventory-service

  boot:
    admin:
      client:
        enabled: false

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  cache:
    type: redis

  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://postgres:5432/inventory_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    schemas: public
    clean-disabled: true

  cloud:
    config:
      enabled: ${CONFIG_SERVER_ENABLED:false}
      uri: ${CONFIG_SERVER_URI:http://config-server:8888}
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:always}
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: inventory-service
  health:
    redis:
      enabled: true
    db:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  packages-to-scan: io.github.alexisTrejo11.drugstore.inventories
  paths-to-match: /api/**
  cache:
    disabled: true

app:
  rate-limit:
    global:
      enabled: true
      maxRequests: ${RATE_LIMIT_GLOBAL_MAX:5000}
      durationHours: 1
    profiles:
      standard:
        maxRequests: ${RATE_LIMIT_STANDARD:40}
        durationSeconds: 60
      sensitive:
        maxRequests: ${RATE_LIMIT_SENSITIVE:7}
        durationSeconds: 60
      public:
        maxRequests: ${RATE_LIMIT_PUBLIC:100}
        durationSeconds: 60
      admin:
        maxRequests: ${RATE_LIMIT_ADMIN:50}
        durationSeconds: 1
      customer-write:
        maxRequests: ${RATE_LIMIT_CUSTOMER_WRITE:20}
        durationSeconds: 60
      customer-read:
        maxRequests: ${RATE_LIMIT_CUSTOMER_READ:100}
        durationSeconds: 60

logging:
  file:
    name: ${LOG_PATH:/app/logs}/inventory-service.log
    path: ${LOG_PATH:/app/logs}
    max-size: ${LOG_MAX_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    io.github.alexisTrejo11.drugstore: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SPRING_SECURITY:WARN}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:WARN}
    libs_kernel.log.audit: ${LOG_LEVEL_AUDIT:INFO}

audit:
  log:
    enabled: true
    excluded-endpoints: /actuator/health, /actuator/info, /actuator/metrics, /actuator/prometheus
    detailed: ${AUDIT_DETAILED:false}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-minutes: ${JWT_REFRESH_TOKEN_EXPIRATION_MINUTES:43200}
  issuer: ${JWT_ISSUER:inventory-service}
