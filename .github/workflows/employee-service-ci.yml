# Employee Service CI — build, test, publish to GHCR, deploy over Cloudflare SSH.
#
# Required repository Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST                     — hostname reachable via Cloudflare Access (SSH)
#   SSH_USER                     — SSH user on the deploy host
#   SSH_PRIVATE_KEY              — private key for that user
#   CF_CLIENT_ID                 — Cloudflare Access service-token client id
#   CF_CLIENT_SECRET             — Cloudflare Access service-token client secret
#   GHCR_TOKEN                   — token with read:packages (pull on deploy host)
#   GHCR_USER                    — optional; defaults to repository owner
#   DRUGSTORE_EMPLOYEE_DEPLOY_PATH — remote dir with compose / Makefile (make refresh)
name: Employee Service CI

on:
  push:
    branches:
      - main
    paths:
      - "employee-service/**"
      - ".github/workflows/employee-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "employee-service/**"
      - ".github/workflows/employee-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: employee-service
      enable_publish: true
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      DEPLOY_PATH: ${{ secrets.DRUGSTORE_EMPLOYEE_DEPLOY_PATH }}

