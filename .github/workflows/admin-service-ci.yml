# Admin Service CI — build and test only (no Docker image yet).
name: Admin Service CI

on:
  push:
    branches:
      - main
    paths:
      - "admin-service/**"
      - ".github/workflows/admin-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "admin-service/**"
      - ".github/workflows/admin-service-ci.yml"
      - ".github/workflows/reusable-service-ci.yml"

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service: admin-service
      enable_publish: false
