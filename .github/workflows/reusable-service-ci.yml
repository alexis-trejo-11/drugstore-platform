# Reusable CI-CD for drugstore microservices:
#   build (Gradle assemble) → test → publish (GHCR) → deploy (Cloudflare SSH)
#
# Callers pass service name, optional enable_publish, and deploy secrets.
name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service:
        description: Service directory name (e.g. address-service)
        required: true
        type: string
      enable_publish:
        description: Build/push Docker image and deploy on main
        required: false
        type: boolean
        default: true
    secrets:
      SSH_HOST:
        required: false
      SSH_USER:
        required: false
      SSH_PRIVATE_KEY:
        required: false
      CF_CLIENT_ID:
        required: false
      CF_CLIENT_SECRET:
        required: false
      GHCR_TOKEN:
        required: false
      GHCR_USER:
        required: false
      DEPLOY_PATH:
        required: false

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assemble --no-daemon

  test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test --no-daemon

  publish:
    needs: test
    if: ${{ inputs.enable_publish && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/drugstore-${{ inputs.service }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.service }}
          file: ./${{ inputs.service }}/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: ${{ inputs.enable_publish && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: ${{ inputs.service }}-deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH over Cloudflare Access
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Service Token auth must NOT go in ProxyCommand as --id/--secret:
          # cloudflared treats those as a listen address. Pass via CF_ACCESS_* env.
          {
            echo "Host deploy-host"
            echo "  HostName ${SSH_HOST}"
            echo "  User ${SSH_USER}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy via SSH (GHCR pull + restart)
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_PATH:-}" ]; then
            echo "::error::DEPLOY_PATH secret is required (remote directory with compose / Makefile)."
            exit 1
          fi

          GHCR_USER="${GHCR_USER:-${{ github.repository_owner }}}"

          ssh deploy-host \
            "export GHCR_TOKEN=$(printf '%q' "$GHCR_TOKEN") \
                    GHCR_USER=$(printf '%q' "$GHCR_USER") \
                    IMAGE=$(printf '%q' "$IMAGE") \
                    IMAGE_TAG=$(printf '%q' "$IMAGE_TAG") \
                    DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH"); bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          # Makefile pulls $(IMAGE):$(IMAGE_TAG) — do not pre-join them.
          make refresh

          docker logout ghcr.io || true
          echo "Deploy finished."
          REMOTE
