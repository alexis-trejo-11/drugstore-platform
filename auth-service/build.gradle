plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'com.google.protobuf' version '0.9.4'
}

def loadDotEnv = {
	def env = [:]
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			if (line && !line.startsWith('#') && line.contains('=')) {
				def (key, value) = line.split('=', 2)
				env[key.trim()] = value.trim()
			}
		}
	}
	return env
}

def dotEnv = loadDotEnv()

def envOrDotEnv = { String key, String defaultValue = null ->
	def fromProperty = findProperty(key)
	(fromProperty != null ? fromProperty.toString() : null)
			?: System.getenv(key)
			?: dotEnv[key]
			?: defaultValue
}

version = '2.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()

	maven {
		name = "GitHubPackages"
		url = uri("https://maven.pkg.github.com/alexisTrejo11/drugstore-platform")

		credentials {
			username = envOrDotEnv("GITHUB_ACTOR", "alexisTrejo11")
			password = envOrDotEnv("GITHUB_TOKEN")
		}
	}

}

ext {
	set('springCloudVersion', "2023.0.3")
	set('grpcVersion', "1.60.0")
	set('protobufVersion', "3.25.1")
}

dependencies {
	// Spring Boot dependencies
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Github packages dependency
	implementation 'io.github.alexisTrejo11:shared-kernel:2.0.0'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:kafka'
	testImplementation 'org.testcontainers:testcontainers'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Security dependencies
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'

	// gRPC Dependencies
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"

	// Protobuf
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

	// javax.annotation (@Generated) for protoc/gRPC generated sources
	implementation 'javax.annotation:javax.annotation-api:1.3.2'

	// Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	// Observability
	implementation 'com.github.loki4j:loki-logback-appender:1.5.2'
	implementation 'io.micrometer:micrometer-registry-prometheus'


	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.4.0'

	// TOTP (Google Authenticator–compatible)
	implementation 'com.warrenstrange:googleauth:1.5.0'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
		all().each { task ->
			task.builtins {
				java {}
			}
		}
	}
}

// Same layout as user-service: IDE / Java LS pick up generated stubs without guessing paths
sourceSets {
	main {
		java {
			srcDir 'build/generated/source/proto/main/java'
			srcDir 'build/generated/source/proto/main/grpc'
		}
	}
}

tasks.withType(Copy) {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
    jvmArgs = [
            "-XX:+TieredCompilation",
            "-XX:TieredStopAtLevel=1",
            //"-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ]

	dotEnv.each { key, value ->
		systemProperty key, value
		environment key, value
	}

	if (!dotEnv['LOG_PATH'] && !System.getenv('LOG_PATH')) {
		def localLogs = file('logs').absolutePath
		systemProperty 'LOG_PATH', localLogs
		environment 'LOG_PATH', localLogs
	}
}
