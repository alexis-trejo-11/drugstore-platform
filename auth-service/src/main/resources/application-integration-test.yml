# Wired further via @DynamicPropertySource (Redis, Kafka, gRPC test server port).
# Profile "test" is activated alongside this profile so logback does not attach Loki.

spring:
  application:
    name: auth-service
  data:
    redis:
      url: redis://localhost:6379
      timeout: 5000ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      enable-idempotence: false
      properties:
        max.block.ms: 30000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: integration-test-client
            client-secret: integration-test-secret
            scope: openid, profile, email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

grpc:
  client:
    user-service:
      host: localhost
      port: 9090

jwt:
  secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  access-token-expiration-minutes: 15
  refresh-token-expiration-minutes: 43200
  issuer: auth-integration-test

kafka:
  topics:
    partitions: 1
    replication-factor: 1

app:
  rate-limit:
    global:
      enabled: true
      maxRequests: 1000000
      durationHours: 1
    profiles:
      standard:
        maxRequests: 100000
        durationSeconds: 60
      sensitive:
        maxRequests: 100000
        durationSeconds: 60
      public:
        maxRequests: 100000
        durationSeconds: 60
      admin:
        maxRequests: 100000
        durationSeconds: 60

logging:
  level:
    root: WARN
    io.github.alexisTrejo11.drugstore.accounts: INFO
