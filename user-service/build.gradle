plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
}

def loadDotEnv = {
    def env = [:]
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            if (line && !line.startsWith('#') && line.contains('=')) {
                def (key, value) = line.split('=', 2)
                env[key.trim()] = value.trim()
            }
        }
    }
    return env
}

def dotEnv = loadDotEnv()

def envOrDotEnv = { String key, String defaultValue = null ->
    def fromProperty = findProperty(key)
    (fromProperty != null ? fromProperty.toString() : null)
        ?: System.getenv(key)
        ?: dotEnv[key]
        ?: defaultValue
}

group = 'at.backend.drugstore.microservice'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/alexisTrejo11/drugstore-platform")

        credentials {
            username = envOrDotEnv("GITHUB_ACTOR", "alexisTrejo11")
            password = envOrDotEnv("GITHUB_TOKEN")
        }
    }
}

ext {
    set('springBootAdminVersion', "3.3.2")
    set('springCloudVersion', "2023.0.3")
    set('grpcVersion', "1.60.0")
    set('protobufVersion', "3.25.1")
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // Admin Service
    implementation 'de.codecentric:spring-boot-admin-starter-client:3.0.0'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Config Server
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Postgres
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.postgresql:postgresql'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    // Common library
    //implementation 'io.github.alexisTrejo11:shared-kernel:1.0.0'

    // Open Api
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Admin Service
    implementation 'de.codecentric:spring-boot-admin-starter-client:3.0.0'

    // gRPC Dependencies
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"

    // Protobuf
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

    // javax.annotation (for @Generated annotation)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

	// Migrations
	implementation 'org.flywaydb:flyway-core:10.17.0'
	implementation 'org.flywaydb:flyway-database-postgresql:10.17.0'

    // Observability
    implementation 'com.github.loki4j:loki-logback-appender:1.5.2'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
        all().each { task ->
            task.builtins {
                java {}
            }
        }
    }
}

// Mark generated proto sources as source directories for IDE recognition
sourceSets {
    main {
        java {
            srcDir 'build/generated/source/proto/main/java'
            srcDir 'build/generated/source/proto/main/grpc'
        }
    }
}

// Configure duplicate handling strategy for all copy tasks
tasks.withType(Copy) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Specific configuration for processResources task
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'io.github.alexisTrejo11.drugstore.users.UserServiceApplication'
}


bootRun {
    jvmArgs = [
            "-XX:+TieredCompilation",
            "-XX:TieredStopAtLevel=1",
            //"-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ]

    dotEnv.each { key, value ->
        systemProperty key, value
        environment key, value
    }
}