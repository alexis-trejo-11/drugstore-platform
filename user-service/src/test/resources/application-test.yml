spring:
  cloud:
    compatibility-verifier:
      enabled: false
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:h2:mem:user_service_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  kafka:
    listener:
      auto-startup: false
  data:
    redis:
      url: redis://localhost:6379

server:
  port: 0

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long
  access-token-expiration-minutes: 60
  refresh-token-expiration-minutes: 120
  issuer: test-issuer

app:
  rate-limit:
    global:
      enabled: false

logging:
  level:
    root: WARN
