# Application only: Nginx + address-service (no bundled DB, Redis, or monitoring).
#
# Use when infrastructure runs elsewhere (host machine, another compose stack, or cloud).
#
# Run from address-service root (reads .env from project root):
#   cp .env.example .env
#   docker compose -f docker/docker-compose.app.yml --env-file .env up -d --build
#
# Set COMPOSE_PROFILES=local|prod in .env (local = host.docker.internal, prod = cloud endpoints).

name: address-service-app

services:
  nginx:
    profiles: [local, prod]
    image: nginx:1.27-alpine
    container_name: address-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      address-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  address-service:
    profiles: [local, prod]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-alexisTrejo11}
        GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env for GitHub Packages}
    hostname: address-service
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ../.env
        required: true
    volumes:
      - ../logs:/app/logs
    networks:
      - drugstore-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
