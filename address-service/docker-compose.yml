services:
  nginx:
    image: nginx:1.27-alpine
    container_name: address-nginx
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP — redirects to HTTPS
      - "443:443"  # HTTPS — terminates TLS, load-balances to address-service replicas
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mount the ssl directory (not individual files) so Docker does not create
      # empty directories when nginx.crt/nginx.key are missing. Run nginx/ssl/generate-certs.sh first.
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      address-service:
        condition: service_healthy
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  address-service:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-alexisTrejo11}
        GITHUB_TOKEN: ${GITHUB_TOKEN:?Set GITHUB_TOKEN in .env for GitHub Packages}
    # No container_name so Docker Compose can scale:
    #   docker compose up --scale address-service=3 -d
    # Nginx upstream round-robins across all replicas via Docker DNS.
    hostname: address-service
    restart: unless-stopped
    # HTTP only inside the network; TLS terminates at Nginx on 80/443.
    expose:
      - "8080"
    environment:
      # Active profile
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
      
      # Database
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=address_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    
      # Logging
      - LOGGING_LEVEL_IO_GITHUB_ALEXISTREJO11=DEBUG

      # Swagger/OpenAPI
      - SWAGGER_ENABLED=true
      
      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m
      
      # Service-specific configuration
      - ADDRESS_SERVICE_MAX_ADDRESSES_PER_USER=10
      - ADDRESS_SERVICE_CACHE_TTL=3600
      
    env_file:
      - .env
      
    volumes:
      # Mount logs for persistence
      - ./logs:/app/logs
      
    networks:
      - drugstore-network
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    # Scale example: docker compose up --scale address-service=3 -d
      
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  postgres:
    image: postgres:15-alpine
    container_name: address-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=address_db
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d address_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: address-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    networks:
      - drugstore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: address-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      address-service:
        condition: service_healthy
    networks:
      - drugstore-network

  loki:
    image: grafana/loki:3.1.1
    container_name: address-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - drugstore-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: address-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - drugstore-network

volumes:
  postgres-data:
    name: address-postgres-data
  redis-data:
    name: address-redis-data
  prometheus-data:
    name: address-prometheus-data
  loki-data:
    name: address-loki-data
  grafana-data:
    name: address-grafana-data

networks:
  drugstore-network:
    name: drugstore-network
    driver: bridge
